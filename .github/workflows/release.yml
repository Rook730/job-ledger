name: Release
on:
  release:
    types: [published]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: gh release upload "${{ github.event.release.tag_name }}" main.js manifest.json --clobber
        env:
          GH_TOKEN: ${{ github.token }}
